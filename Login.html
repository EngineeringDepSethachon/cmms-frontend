<!-- หน้าเข้าสู่ระบบ (Auth): สำหรับยืนยันตัวตนด้วย Username/Password ที่กำหนดใน Google Sheet -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="config.js"></script>
    <script src="api.js"></script>
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Sarabun', sans-serif; }
        .login-card { width: 100%; max-width: 380px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <h3 class="text-center fw-bold text-primary mb-4">🔐 เข้าสู่ระบบ</h3>
        
        <div class="mb-3">
            <label class="form-label text-muted">ชื่อผู้ใช้งาน (Username)</label>
            <input type="text" id="userInput" class="form-control form-control-lg" placeholder="กรอกชื่อผู้ใช้">
        </div>
        
        <div class="mb-4">
            <label class="form-label text-muted">รหัสผ่าน (Password)</label>
            <input type="password" id="passInput" class="form-control form-control-lg" placeholder="กรอกรหัสผ่าน" onkeypress="if(event.key === 'Enter') doLogin()">
        </div>

        <button id="loginBtn" class="btn btn-primary btn-lg w-100 fw-bold" onclick="doLogin()">เข้าสู่ระบบ</button>
        <div id="errorMsg" class="text-danger text-center mt-3 small"></div>

        <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: 0.72rem; line-height: 1.4;">
            <i class="bi bi-shield-lock-fill text-primary me-1"></i> ระบบมีการบันทึกประวัติการเข้าใช้งานและ IP Address เพื่อความปลอดภัยของระบบสารสนเทศองค์กร
        </div>
    </div>

    <script>
        // เริ่มตรวจจับ IP & ข้อมูลเครื่องล่วงหน้าทันทีที่เปิดหน้า
        window.addEventListener('DOMContentLoaded', () => {
            getRealClientNetworkInfo().catch(() => {});
        });

        async function doLogin() {
            var user = document.getElementById('userInput').value;
            var pass = document.getElementById('passInput').value;
            var btn = document.getElementById('loginBtn');
            var msg = document.getElementById('errorMsg');
            
            if(!user || !pass) {
                msg.innerHTML = 'กรุณากรอกข้อมูลให้ครบถ้วน';
                return;
            }
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> กำลังตรวจสอบ...';
            btn.disabled = true;
            msg.innerHTML = '';

            const net = await getRealClientNetworkInfo();

            google.script.run
                .withSuccessHandler(function(res) {
                    if(res.success) {
                        localStorage.setItem('userRole', res.role); // Role ภายในระบบ (staff, qc, admin)
                        localStorage.setItem('userPosition', res.position); // ดึงตำแหน่งจริงๆ จาก Master_Data คอลัมน์ E
                        localStorage.setItem('userName', res.name);
                        localStorage.setItem('userLogin', res.username); // เก็บชื่อภาษาอังกฤษเพื่อใช้เช็คสิทธิ์
                        localStorage.setItem('userLevel', res.level);
                        localStorage.setItem('userDept', res.department);
                        localStorage.setItem('userUid', res.uid || "-");

                        // บันทึก Log เข้าระบบพร้อม IP เครื่องจริงและอุปกรณ์
                        google.script.run.logAction({
                            name: res.name,
                            dept: res.department,
                            pos: res.position,
                            action: "เข้าสู่ระบบ (Login)",
                            targetTicket: "-",
                            page: "Login",
                            uid: res.uid || "-",
                            device: net.device,
                            ip: net.ip
                        });
                        
                        // นำทางไปยังหน้าเป้าหมายที่กำหนดไว้ในตัวแปร target
                        const params = getUrlParams();
                        let target = params.target || 'Home.html';
                        if (!target.toLowerCase().endsWith('.html')) {
                            target = target + '.html';
                        }
                        window.location.href = target;
                        
                    } else {
                        msg.innerHTML = res.message;
                        btn.innerHTML = 'เข้าสู่ระบบ';
                        btn.disabled = false;
                    }
                })
                .withFailureHandler(function(err) {
                    msg.innerHTML = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                    btn.innerHTML = 'เข้าสู่ระบบ';
                    btn.disabled = false;
                })
                .verifyUserLogin(user, pass);
        }
    </script>
</body>
</html>
