<!-- หน้าช่างทั่วไป (GeneralTech): ปฏิบัติงานซ่อมทั่วไป -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่างทั่วไป - CMMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Prompt:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neo-dark: #191A23;
            --neo-light: #F3F3F3;
            --neo-green: #B9FF66;
            --neo-blue: #00D1FF;
            --neo-white: #FFFFFF;
            --border-width: 2px;
        }

        body { 
            background-color: var(--neo-white); 
            font-family: 'Sarabun', sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--neo-dark);
        }

        .card-neo {
            background-color: var(--neo-light);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 16px;
            box-shadow: 4px 4px 0px var(--neo-dark);
        }

        .badge-dept {
            background-color: var(--neo-blue);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 2px 2px 0px var(--neo-dark);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="system-header border-bottom border-3 border-dark mb-4" style="background-color: var(--neo-green); padding: 15px 0; box-shadow: 0 4px 0 var(--neo-dark);">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="header-brand fw-bold fs-4 text-dark" style="cursor:pointer;" onclick="window.location.href='Home.html'">
                <i class="bi bi-tools me-2 text-primary"></i> ช่างทั่วไป (General Technician)
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge-dept">
                    <i class="bi bi-wrench me-1"></i> ปฏิบัติงานช่าง
                </span>
                <a href="Home.html" class="btn btn-light border-2 border-dark fw-bold rounded ms-2" style="box-shadow: 2px 2px 0 var(--neo-dark);"><i class="bi bi-house-door me-1"></i> Home</a>
            </div>
        </div>
    </header>

    <div class="container my-4 flex-grow-1" style="max-width: 800px;">
        <div class="card-neo p-4 text-center">
            <h4 class="fw-bold mb-3"><i class="bi bi-check-circle-fill text-success me-2"></i>ระบบปฏิบัติงานช่างทั่วไปพร้อมใช้งาน</h4>
            <p class="text-muted">สามารถดูและบันทึกผลงานซ่อมผ่านทาง Portal ได้ตามปกติ</p>
            <a href="Home.html" class="btn btn-dark border-2 border-dark fw-bold px-4 py-2 mt-2" style="box-shadow: 3px 3px 0 var(--neo-dark);"><i class="bi bi-arrow-left me-1"></i> กลับหน้าหลัก (Home)</a>
        </div>
    </div>

</body>
</html>
