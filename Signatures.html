<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --neo-dark: #191A23;
            --neo-light: #F3F3F3;
            --neo-green: #B9FF66;
            --neo-white: #FFFFFF;
            --border-width: 2px;
        }

        body { 
            background-color: var(--neo-white); 
            font-family: 'Sarabun', sans-serif; 
            color: var(--neo-dark);
            display: none; /* Hide until authenticated */
        }

        .neo-box {
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--neo-dark);
            background-color: var(--neo-white);
            transition: all 0.2s ease;
        }

        .neo-box:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--neo-dark);
        }

        .neo-btn {
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--neo-dark);
            transition: all 0.1s ease;
        }

        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--neo-dark);
        }

        .table-custom {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-custom th, .table-custom td {
            border-bottom: var(--border-width) solid var(--neo-dark);
            border-right: var(--border-width) solid var(--neo-dark);
            padding: 12px;
            vertical-align: middle;
        }
        
        .table-custom th:last-child, .table-custom td:last-child {
            border-right: none;
        }
        .table-custom tr:last-child td {
            border-bottom: none;
        }

        .table-custom th {
            background-color: var(--neo-green);
            color: var(--neo-dark);
        }

        .signature-preview {
            max-width: 120px;
            max-height: 60px;
            object-fit: contain;
            border: 1px dashed var(--neo-dark);
            border-radius: 4px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
        <header class="system-header border-bottom border-3 border-dark mb-4" style="background-color: var(--neo-green); padding: 15px 0; box-shadow: 0 4px 0 var(--neo-dark); position: relative; z-index: 10;">
        <div class="container-fluid px-md-4 d-flex justify-content-between align-items-center">
            <div class="header-brand fw-bold fs-4 text-dark" style="cursor:pointer;" onclick="window.location.href='Home.html'">
                <i class="bi bi-tools me-2 fs-2"></i> <span class="d-none d-sm-inline">CMMS System</span><span class="d-inline d-sm-none">CMMS</span>
            </div>
            <div class="d-flex align-items-center gap-2 gap-md-3">
                <div class="user-info-badge d-none d-lg-block fw-bold bg-white text-dark border border-2 border-dark rounded px-3 py-2" style="box-shadow: 2px 2px 0 var(--neo-dark);">
                    <i class="bi bi-person-badge-fill me-1"></i> <span id="topUserName">-</span> | <span id="topUserDept">-</span>
                </div>
                <a href="Home.html" class="btn btn-light border-2 border-dark fw-bold rounded" style="box-shadow: 2px 2px 0 var(--neo-dark);"><i class="bi bi-house-door"></i><span class="d-none d-md-inline ms-1"> Home</span></a>
                <button class="btn btn-light border-2 border-dark fw-bold rounded" style="box-shadow: 2px 2px 0 var(--neo-dark);" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i></button>
                <button class="btn btn-dark border-2 border-dark fw-bold rounded" style="box-shadow: 2px 2px 0 #fff;" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline ms-1"> Logout</span></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <div class="neo-box p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0"><i class="bi bi-person-lines-fill me-2"></i>จัดการลายเซ็นพนักงาน (Level 5 Only)</h3>
                <button class="btn btn-outline-dark neo-btn" onclick="loadUsers()"><i class="bi bi-arrow-clockwise me-1"></i>รีเฟรช</button>
            </div>
            
            <div class="alert alert-info border-dark border-2" style="border-radius: 8px;">
                <i class="bi bi-info-circle-fill me-2"></i><strong>คำแนะนำ:</strong> เลือกไฟล์รูปภาพลายเซ็นเฉพาะนามสกุล <code>.png</code> พื้นหลังโปร่งใส เพื่อความสวยงามเมื่อนำไปประทับบนเอกสาร PDF
            </div>

            <div class="table-responsive">
                <table class="table-custom text-center">
                    <thead>
                        <tr>
                            <th>ลำดับ</th>
                            <th>UID / Emp ID</th>
                            <th>ชื่อ - สกุล</th>
                            <th>แผนก</th>
                            <th>ตำแหน่ง</th>
                            <th>ลายเซ็นปัจจุบัน</th>
                            <th>อัปโหลดไฟล์ (.png)</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="7" class="p-5 text-center">
                                <div class="spinner-border text-dark" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <div class="mt-2 fw-bold">กำลังโหลดข้อมูล...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hidden file input for uploading -->
    <input type="file" id="fileInput" accept="image/png" style="display: none;">

    <script>
        let currentUserUidToUpload = null;

        window.onload = function() {
            // Check Authentication & Authorization
            const userLevel = parseInt(localStorage.getItem('userLevel') || 0);
            
            if (userLevel < 5) {
                Swal.fire({
                    icon: 'error',
                    title: 'ปฏิเสธการเข้าถึง',
                    text: 'หน้านี้สงวนสิทธิ์สำหรับผู้ใช้งานระดับ Level 5 เท่านั้น',
                    confirmButtonText: 'กลับหน้าหลัก',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = "Home.html";
                });
                return;
            }

            // Display UI
            document.body.style.display = "block";
            document.getElementById('topUserName').innerText = localStorage.getItem('userName') || 'Admin';

            // Load user data
            loadUsers();
        };

        function logout() {
            localStorage.clear();
            window.location.href = "Login.html?target=Signatures.html";
        }

        function loadUsers() {
            document.getElementById('userTableBody').innerHTML = `
                <tr>
                    <td colspan="7" class="p-5 text-center">
                        <div class="spinner-border text-dark" role="status"></div>
                        <div class="mt-2 fw-bold">กำลังโหลดข้อมูล...</div>
                    </td>
                </tr>`;
                
            google.script.run
                .withSuccessHandler(renderTable)
                .withFailureHandler(function(err) {
                    document.getElementById('userTableBody').innerHTML = `<tr><td colspan="7" class="text-danger fw-bold">❌ ${err.message || 'เกิดข้อผิดพลาดในการโหลดข้อมูล'}</td></tr>`;
                })
                .getSignatureUsers();
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-muted fw-bold">ไม่มีข้อมูลผู้ใช้งาน</td></tr>`;
                return;
            }

            let html = '';
            users.forEach((user, index) => {
                const uid = user.uid || '-';
                const empId = user.empId || '-';
                const hasSignature = user.signatureUrl && user.signatureUrl.trim() !== '';
                
                let previewHtml = hasSignature 
                    ? `<a href="${user.signatureUrl}" target="_blank"><img src="${user.signatureUrl}" class="signature-preview" alt="Signature"></a>` 
                    : `<span class="badge bg-secondary text-light rounded-pill px-3">ไม่มีลายเซ็น</span>`;

                html += `
                    <tr>
                        <td class="fw-bold">${index + 1}</td>
                        <td>
                            <small class="d-block text-muted">UID: ${uid}</small>
                            <span class="fw-bold">${empId}</span>
                        </td>
                        <td class="text-start">${user.name}</td>
                        <td>${user.department}</td>
                        <td>${user.position}</td>
                        <td>${previewHtml}</td>
                        <td>
                            <button class="btn btn-sm btn-dark neo-btn" onclick="triggerUpload('${uid}', '${empId}')" ${uid === '-' ? 'disabled' : ''}>
                                <i class="bi bi-upload me-1"></i> อัปโหลด
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function triggerUpload(uid, empId) {
            if (!uid || uid === '-') {
                Swal.fire('ข้อผิดพลาด', 'ผู้ใช้งานนี้ไม่มี UID ระบบไม่สามารถอัปโหลดได้', 'error');
                return;
            }
            currentUserUidToUpload = uid;
            
            // Set file input name format
            const input = document.getElementById('fileInput');
            input.value = ''; // Reset
            input.click();
        }

        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== "image/png") {
                Swal.fire('ประเภทไฟล์ไม่ถูกต้อง', 'กรุณาอัปโหลดไฟล์รูปภาพนามสกุล .png เท่านั้น', 'warning');
                return;
            }
            
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire('ไฟล์ขนาดใหญ่เกินไป', 'ขนาดไฟล์ต้องไม่เกิน 2MB', 'warning');
                return;
            }

            const uid = currentUserUidToUpload;
            const filename = `signature_${uid}.png`;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                
                Swal.fire({
                    title: 'กำลังอัปโหลด...',
                    text: 'กรุณารอสักครู่ ระบบกำลังบันทึกลายเซ็นลงฐานข้อมูล',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                google.script.run
                    .withSuccessHandler(function(res) {
                        if (res.success) {
                            Swal.fire({
                                icon: 'success',
                                title: 'สำเร็จ!',
                                text: res.message,
                                timer: 1500,
                                showConfirmButton: false
                            });
                            loadUsers(); // Refresh table
                        } else {
                            Swal.fire('ข้อผิดพลาด', res.message, 'error');
                        }
                    })
                    .withFailureHandler(function(err) {
                        Swal.fire('ข้อผิดพลาด', err.message || 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้', 'error');
                    })
                    .uploadSignature(uid, base64Data, filename);
            };
            reader.readAsDataURL(file);
        });

    </script>
</body>
</html>
