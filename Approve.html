<!-- หน้าอนุมัติงาน (Management): สำหรับผู้บริหาร (Level 5) ตรวจสอบแผนงานและอนุมัติการซ่อม -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Approval - การอนุมัติซ่อมบำรุง</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <style>
        :root {
            --neo-dark: #191A23;
            --neo-light: #F4F6F9;
            --neo-green: #B9FF66;
            --neo-white: #FFFFFF;
            --neo-yellow: #FFD166;
            --neo-danger: #FF5E5E;
            --border-width: 2px;
            --shadow-depth: 4px;
        }

        body { 
            background-color: var(--neo-light); 
            font-family: 'Sarabun', sans-serif; 
            color: var(--neo-dark);
        }

        h1, h2, h3, h4, h5, h6, .font-prompt {
            font-family: 'Prompt', sans-serif;
        }

        /* Neo-Brutalist Header */
        .system-header { 
            background-color: var(--neo-green); 
            color: var(--neo-dark); 
            padding: 14px 0; 
            border-bottom: 3px solid var(--neo-dark); 
            box-shadow: 0 4px 0 var(--neo-dark);
            position: relative; 
            z-index: 10;
        }

        .header-brand {
            font-weight: 800;
            font-size: 1.45rem;
            display: flex;
            align-items: center;
        }

        .header-brand i { margin-right: 10px; color: var(--neo-dark); }

        /* Neo-Brutalist Buttons */
        .btn-neo {
            background-color: var(--neo-white);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            font-weight: 700;
            padding: 6px 14px;
            box-shadow: 2px 2px 0px var(--neo-dark);
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-neo:hover { 
            transform: translate(2px, 2px); 
            box-shadow: 0px 0px 0px var(--neo-dark); 
            background-color: var(--neo-green); 
            color: var(--neo-dark); 
        }
        
        .btn-neo-dark { 
            background-color: var(--neo-dark); 
            color: var(--neo-white); 
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            box-shadow: 2px 2px 0px #ffffff;
            font-weight: 700;
            padding: 6px 14px;
        }
        .btn-neo-dark:hover { 
            background-color: #333; 
            color: var(--neo-green); 
            transform: translate(1px, 1px);
        }

        .btn-neo-approve {
            background-color: var(--neo-green);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 3px 3px 0px var(--neo-dark);
            transition: all 0.15s ease;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
        }
        .btn-neo-approve:hover {
            background-color: #a3f542;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--neo-dark);
            color: var(--neo-dark);
        }

        .btn-neo-reject {
            background-color: var(--neo-white);
            color: #dc3545;
            border: var(--border-width) solid #dc3545;
            border-radius: 10px;
            font-weight: 700;
            box-shadow: 3px 3px 0px #dc3545;
            transition: all 0.15s ease;
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
        }
        .btn-neo-reject:hover {
            background-color: #dc3545;
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #dc3545;
        }

        /* User Badge */
        .user-info-badge {
            background-color: var(--neo-white);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--neo-dark);
        }

        /* Approval Card */
        .approval-card { 
            border-radius: 14px; 
            border: var(--border-width) solid var(--neo-dark); 
            box-shadow: var(--shadow-depth) var(--shadow-depth) 0px var(--neo-dark); 
            background: var(--neo-white); 
            transition: transform 0.15s ease, box-shadow 0.15s ease; 
            margin-bottom: 24px;
        }
        .approval-card:hover { 
            box-shadow: 6px 6px 0px var(--neo-dark); 
        }

        .card-header-neo {
            background-color: var(--neo-dark);
            color: var(--neo-white);
            border-bottom: var(--border-width) solid var(--neo-dark);
            padding: 12px 18px;
        }

        .form-control-neo {
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            box-shadow: 2px 2px 0px var(--neo-dark);
            font-size: 0.95rem;
        }
        .form-control-neo:focus {
            border-color: var(--neo-dark);
            outline: none;
            box-shadow: 3px 3px 0px var(--neo-green);
        }

        /* Image Display */
        .image-preview-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: var(--border-width) solid var(--neo-dark);
            box-shadow: 3px 3px 0px var(--neo-dark);
            background-color: #e9ecef;
            transition: all 0.2s ease;
        }
        .image-preview-wrapper:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--neo-dark);
        }
        .image-preview-wrapper:hover .image-zoom-overlay {
            opacity: 1;
        }

        .img-preview-box {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .image-zoom-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(25, 26, 35, 0.88);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            padding: 6px;
            opacity: 0.9;
            transition: opacity 0.2s ease;
        }

        .info-pill-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .search-container {
            background: var(--neo-white);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 12px;
            box-shadow: 3px 3px 0px var(--neo-dark);
            padding: 12px 18px;
            margin-bottom: 24px;
        }

        @media (min-width: 992px) {
            .border-end-lg {
                border-right: 2px dashed #dee2e6;
            }
        }
    </style>
</head>
<body>
    <!-- หัวกระดาษของระบบ (System Header) -->
    <header class="system-header">
        <div class="container-fluid px-md-4 d-flex justify-content-between align-items-center">
            <div class="header-brand fw-bold text-dark" style="cursor:pointer;" onclick="window.location.href='Home.html'">
                <i class="bi bi-shield-check fs-2 text-dark"></i> 
                <span class="d-none d-sm-inline font-prompt">CMMS System | อนุมัติงานซ่อม</span>
                <span class="d-inline d-sm-none font-prompt">CMMS Approve</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="user-info-badge d-none d-lg-block">
                    <i class="bi bi-person-badge-fill me-1 text-primary"></i> <span id="topUserName">-</span> | <span id="topUserDept">-</span>
                </div>
                <a href="Home.html" class="btn-neo btn-sm py-2"><i class="bi bi-house-door"></i><span class="d-none d-md-inline ms-1"> Home</span></a>
                <button class="btn-neo btn-sm py-2" onclick="loadPendingJobs()"><i class="bi bi-arrow-clockwise"></i><span class="d-none d-md-inline ms-1"> รีเฟรช</span></button>
                <button class="btn-neo-dark btn-sm py-2" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline ms-1"> Logout</span></button>
            </div>
        </div>
    </header>

    <div id="mainSection" class="container py-3">
        <!-- Page Title & Header Section -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold mb-1 font-prompt text-dark">
                    <i class="bi bi-clipboard2-check-fill text-success me-2"></i>การอนุมัติซ่อมบำรุง 
                    <span class="text-muted fs-6 fw-normal">(Management Approval)</span>
                </h3>
                <p class="text-muted mb-0 small">
                    ตรวจสอบภาพถ่ายปัญหาหน้างาน รายละเอียดการแจ้งซ่อม และแผนการดำเนินงานของฝ่ายช่างก่อนทำการอนุมัติ
                </p>
            </div>
            <div>
                <span class="badge bg-dark text-white border border-2 border-dark rounded-pill px-3 py-2 fs-6" id="jobCountBadge">
                    <i class="bi bi-hourglass-split text-warning me-1"></i> ตรวจสอบข้อมูล...
                </span>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="search-container">
            <div class="row g-2 align-items-center">
                <div class="col-md-7 col-lg-8">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-2 border-dark"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-2 border-dark" placeholder="ค้นหาด้วยรหัสใบงาน, ชื่อเครื่องจักร/สถานที่, ผู้แจ้ง หรืออาการเสีย..." onkeyup="filterJobs()">
                        <button class="btn btn-outline-secondary border-2 border-dark" type="button" onclick="document.getElementById('searchInput').value=''; filterJobs();">ล้าง</button>
                    </div>
                </div>
                <div class="col-md-5 col-lg-4 text-md-end">
                    <button class="btn btn-neo btn-sm py-2 px-3 w-100 w-md-auto" onclick="loadPendingJobs()">
                        <i class="bi bi-arrow-repeat me-1"></i> โหลดข้อมูลล่าสุด
                    </button>
                </div>
            </div>
        </div>

        <!-- Job List Container -->
        <div id="jobList">
            <div class="text-center p-5 bg-white rounded-4 border border-2 border-dark" style="box-shadow: 4px 4px 0 var(--neo-dark);">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 fw-bold text-dark font-prompt">⏳ กำลังตรวจสอบรายการงานซ่อมรออนุมัติ...</p>
            </div>
        </div>
    </div>

    <!-- Modal ขยายดูรูปภาพขนาดใหญ่ -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border border-3 border-dark rounded-3" style="box-shadow: 6px 6px 0px var(--neo-dark);">
                <div class="modal-header bg-dark text-white py-2 border-bottom border-2 border-dark">
                    <h6 class="modal-title fw-bold m-0 font-prompt" id="imageModalTitle"><i class="bi bi-image me-2 text-warning"></i>รูปภาพประกอบใบงาน</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-2 text-center bg-light">
                    <img id="imageModalImg" src="" class="img-fluid rounded border border-2 border-dark" style="max-height: 80vh; object-fit: contain;">
                </div>
                <div class="modal-footer bg-white py-2 border-top border-2 border-dark d-flex justify-content-between">
                    <a id="imageModalOpenNewTab" href="#" target="_blank" class="btn btn-outline-dark btn-sm fw-bold">
                        <i class="bi bi-box-arrow-up-right me-1"></i> เปิดรูปขนาดเต็มในแท็บใหม่
                    </a>
                    <button type="button" class="btn btn-dark btn-sm px-4 fw-bold" data-bs-dismiss="modal">ปิดหน้าต่าง</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ระบบตรวจสอบสิทธิ์ (Login Gatekeeper) ---
        const userRole = localStorage.getItem('userRole');
        const userLevel = parseInt(localStorage.getItem('userLevel') || 0);
        const currentLogin = localStorage.getItem('userLogin');
        const currentName = localStorage.getItem('userName');
        const currentPos = localStorage.getItem('userPosition'); 

        if (!userRole && !currentLogin) {
            window.location.href = "Login.html?target=Approve.html";
        }

        function updateTopNavbar() {
            document.getElementById('topUserName').innerText = localStorage.getItem('userName') || 'Unknown';
            if (document.getElementById('topUserDept')) document.getElementById('topUserDept').innerText = localStorage.getItem('userDept') || '-';
        }

        function logout() { 
            localStorage.clear(); 
            window.location.href = "Login.html?target=Approve.html"; 
        }

        let allTickets = [];

        function loadPendingJobs() {
            const container = document.getElementById('jobList');
            container.innerHTML = `
                <div class="text-center p-5 bg-white rounded-4 border border-2 border-dark" style="box-shadow: 4px 4px 0 var(--neo-dark);">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 fw-bold text-dark font-prompt">⏳ กำลังตรวจสอบรายการรออนุมัติ...</p>
                </div>`;

            google.script.run
                .withSuccessHandler(function(data) {
                    allTickets = data.allTickets || [];
                    renderJobs();
                })
                .withFailureHandler(function(err) {
                    container.innerHTML = `
                        <div class="alert alert-danger text-center py-5 shadow-sm bg-white rounded-4 border border-2 border-danger" style="box-shadow: 4px 4px 0 var(--neo-dark);">
                            <i class="bi bi-exclamation-octagon-fill fs-1 text-danger d-block mb-3"></i>
                            <h5 class="fw-bold font-prompt">ไม่สามารถดึงข้อมูลรออนุมัติได้</h5>
                            <p class="mb-0 text-muted">${err.message || err}</p>
                            <button class="btn btn-neo mt-3" onclick="loadPendingJobs()">
                                <i class="bi bi-arrow-clockwise me-1"></i> ลองใหม่อีกครั้ง
                            </button>
                        </div>`;
                })
                .getDashboardData();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.toString().replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function renderJobs() {
            // กรองเอาเฉพาะงานที่สถานะ "รออนุมัติการซ่อม"
            const pendingApproval = allTickets.filter(t => t.status === "รออนุมัติการซ่อม");
            
            const countBadge = document.getElementById('jobCountBadge');
            if (countBadge) {
                countBadge.innerHTML = `<i class="bi bi-hourglass-split text-warning me-1"></i> รออนุมัติ: <b>${pendingApproval.length}</b> รายการ`;
            }

            const container = document.getElementById('jobList');
            container.innerHTML = '';

            if (pendingApproval.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-success text-center py-5 shadow-sm bg-white rounded-4 border border-2 border-dark" style="box-shadow: 4px 4px 0 var(--neo-dark);">
                        <i class="bi bi-check-circle-fill text-success fs-1 d-block mb-3"></i>
                        <h4 class="fw-bold font-prompt text-dark">ยอดเยี่ยม! ไม่มีงานค้างรออนุมัติในขณะนี้</h4>
                        <p class="text-muted mb-0">ระบบได้ตรวจสอบข้อมูลล่าสุดเรียบร้อยแล้ว หากมีรายการแจ้งเข้ามาใหม่จะปรากฏที่นี่</p>
                        <button class="btn btn-neo mt-3" onclick="loadPendingJobs()"><i class="bi bi-arrow-clockwise me-1"></i> ตรวจสอบอีกครั้ง</button>
                    </div>`;
                return;
            }

            pendingApproval.forEach((t, idx) => {
                const safeId = 'job_' + idx + '_' + (t.ticket || '').replace(/[^a-zA-Z0-9_-]/g, '_');
                
                // รูปภาพปัญหาตอนแจ้งซ่อม
                const hasImage = t.imageUrl && t.imageUrl !== '-' && t.imageUrl.trim() !== '';
                const mainImageUrl = hasImage ? (t.rawImageUrl || (t.imageUrl.indexOf('sz=w500') !== -1 ? t.imageUrl.replace('sz=w500', 'sz=w1200') : t.imageUrl)) : '';
                
                // รูปภาพซ่อมเสร็จ (ถ้ามี)
                const hasCompImage = t.completionImageUrl && t.completionImageUrl !== '-' && t.completionImageUrl.trim() !== '';
                const compImageUrl = hasCompImage ? (t.rawCompUrl || (t.completionImageUrl.indexOf('sz=w500') !== -1 ? t.completionImageUrl.replace('sz=w500', 'sz=w1200') : t.completionImageUrl)) : '';

                // ข้อความสำหรับใช้ค้นหา
                const searchText = `${t.ticket} ${t.engTicketId || ''} ${t.target || ''} ${t.problem || ''} ${t.reqName || ''} ${t.assignDept || ''} ${t.cause || ''}`.toLowerCase();

                container.innerHTML += `
                    <div class="card approval-card p-0 overflow-hidden mb-4 border-0 job-item-card" data-search-text="${escapeHtml(searchText)}">
                        <!-- Card Header -->
                        <div class="card-header-neo d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div class="d-flex flex-wrap align-items-center gap-2">
                                <span class="badge bg-white text-dark border border-2 border-dark px-3 py-2 fs-6" style="box-shadow: 2px 2px 0 #000;">
                                    <i class="bi bi-ticket-perforated-fill text-primary me-1"></i> ${escapeHtml(t.ticket)}
                                </span>
                                ${t.engTicketId && t.engTicketId !== t.ticket ? `
                                    <span class="badge bg-secondary-subtle text-dark border border-dark px-2 py-1 small">
                                        <i class="bi bi-wrench me-1"></i>รหัสช่าง: ${escapeHtml(t.engTicketId)}
                                    </span>
                                ` : ''}
                                <span class="badge text-dark border border-2 border-dark px-3 py-2 fw-bold" style="background-color: var(--neo-yellow);">
                                    <i class="bi bi-gear-wide-connected me-1"></i> ${escapeHtml(t.target || 'ไม่ระบุอุปกรณ์/สถานที่')}
                                </span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="text-white-50 small d-none d-md-inline">
                                    <i class="bi bi-calendar-event me-1"></i> แจ้งเมื่อ: ${escapeHtml(t.date || '-')}
                                </span>
                                <span class="badge bg-white text-primary rounded-pill px-3 py-2 fw-bold border border-2 border-dark">
                                    <i class="bi bi-hourglass-split text-warning me-1"></i> ${escapeHtml(t.status)}
                                </span>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="card-body bg-white p-3 p-md-4">
                            <div class="row g-3 g-md-4">
                                <!-- 1. ข้อมูลการแจ้งซ่อม & รูปภาพ -->
                                <div class="col-lg-4 col-md-12 border-end-lg">
                                    <h6 class="fw-bold text-dark border-bottom border-2 border-dark pb-2 mb-3 font-prompt">
                                        <i class="bi bi-camera-fill text-primary me-1"></i> 1. ภาพถ่าย & ข้อมูลการแจ้งซ่อม
                                    </h6>

                                    <!-- กล่องรูปภาพประกอบ -->
                                    ${hasImage ? `
                                        <div class="image-preview-wrapper mb-3" onclick="openImageModal('${escapeJs(mainImageUrl)}', 'รูปภาพแจ้งซ่อม: ${escapeJs(t.ticket)}')">
                                            <img src="${t.imageUrl}" class="img-preview-box" alt="รูปภาพปัญหาหน้างาน" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'p-4 text-center text-muted bg-light border border-2 border-dark rounded-3\\'><i class=\\'bi bi-exclamation-triangle fs-2 d-block mb-1 text-warning\\'></i><small class=\\'fw-bold\\'>รูปภาพไม่สามารถแสดงผลได้</small></div>';">
                                            <div class="image-zoom-overlay">
                                                <i class="bi bi-arrows-fullscreen me-1"></i> คลิกเพื่อดูภาพขยายขนาดใหญ่
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="p-4 mb-3 border border-2 border-dashed border-secondary rounded-3 text-center bg-light text-muted">
                                            <i class="bi bi-camera-slash fs-2 d-block mb-1 text-secondary opacity-50"></i>
                                            <small class="fw-bold d-block">ไม่มีรูปภาพแนบตอนแจ้งซ่อม</small>
                                        </div>
                                    `}

                                    ${hasCompImage ? `
                                        <div class="mb-3">
                                            <small class="text-success fw-bold d-block mb-1"><i class="bi bi-check-circle-fill me-1"></i>รูปภาพการแก้ไข/ซ่อมเสร็จ:</small>
                                            <div class="image-preview-wrapper" style="height: 110px;" onclick="openImageModal('${escapeJs(compImageUrl)}', 'รูปภาพซ่อมเสร็จ: ${escapeJs(t.ticket)}')">
                                                <img src="${t.completionImageUrl}" class="img-preview-box" style="height: 110px;" alt="รูปภาพหลังซ่อม">
                                                <div class="image-zoom-overlay py-1"><i class="bi bi-zoom-in me-1"></i>ดูรูปหลังซ่อม</div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    <!-- รายละเอียดเครื่องจักร & ปัญหา -->
                                    <div class="mb-2 p-2 bg-light border border-2 border-dark rounded" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.08);">
                                        <div class="small text-muted fw-bold"><i class="bi bi-geo-alt-fill text-danger me-1"></i>เครื่องจักร / จุดติดตั้ง:</div>
                                        <div class="fw-bold text-dark fs-6">${escapeHtml(t.target || '-')}</div>
                                    </div>

                                    <div class="mb-2 p-3 bg-danger-subtle border border-2 border-danger rounded" style="box-shadow: 2px 2px 0 rgba(220,53,69,0.15);">
                                        <div class="small fw-bold text-danger"><i class="bi bi-exclamation-octagon-fill me-1"></i>อาการเสีย / ปัญหาที่แจ้ง:</div>
                                        <div class="fw-bold text-dark mt-1" style="white-space: pre-wrap; font-size: 0.95rem;">${escapeHtml(t.problem || 'ไม่ได้ระบุอาการเสีย')}</div>
                                    </div>

                                    <div class="info-pill-box">
                                        <div class="small mb-1">
                                            <strong><i class="bi bi-person-fill text-primary me-1"></i>ผู้แจ้งซ่อม:</strong> ${escapeHtml(t.reqName || '-')}
                                            <span class="badge bg-secondary-subtle text-dark border ms-1">${escapeHtml(t.reqPosition || 'พนักงาน')}</span>
                                        </div>
                                        <div class="small text-muted mb-1">
                                            <strong><i class="bi bi-clock me-1"></i>วันเวลาที่แจ้ง:</strong> ${escapeHtml(t.date || '-')}
                                        </div>
                                        ${t.note ? `
                                            <div class="small text-muted border-top pt-1 mt-1">
                                                <strong>หมายเหตุผู้แจ้ง:</strong> ${escapeHtml(t.note)}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>

                                <!-- 2. แผนการซ่อมบำรุงและการประเมินของช่าง -->
                                <div class="col-lg-4 col-md-12 border-end-lg">
                                    <h6 class="fw-bold text-dark border-bottom border-2 border-dark pb-2 mb-3 font-prompt">
                                        <i class="bi bi-tools text-warning me-1"></i> 2. การประเมิน & แผนงานซ่อม
                                    </h6>

                                    <!-- สาเหตุของปัญหา -->
                                    <div class="mb-2 p-3 bg-warning-subtle border border-2 border-warning rounded" style="box-shadow: 2px 2px 0 rgba(255,193,7,0.2);">
                                        <div class="small fw-bold text-dark"><i class="bi bi-search me-1 text-warning-emphasis"></i>สาเหตุของปัญหา (การวิเคราะห์):</div>
                                        <div class="fw-bold text-dark mt-1" style="white-space: pre-wrap;">${escapeHtml(t.cause || 'ยังไม่ได้ระบุสาเหตุ')}</div>
                                    </div>

                                    <!-- วิธีการแก้ไข -->
                                    <div class="mb-2 p-3 bg-light border border-2 border-dark rounded" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.08);">
                                        <div class="small fw-bold text-primary"><i class="bi bi-wrench-adjustable me-1"></i>วิธีการแก้ไข / แผนการดำเนินการ:</div>
                                        <div class="text-dark mt-1 fw-semibold" style="white-space: pre-wrap;">${escapeHtml(t.repairMethod || 'ยังไม่ได้ระบุวิธีแก้ไข')}</div>
                                    </div>

                                    ${t.repairDetails ? `
                                        <div class="mb-2 p-2 bg-light border rounded small">
                                            <div class="fw-bold text-muted"><i class="bi bi-card-text me-1"></i>รายละเอียดการซ่อมเพิ่มเติม:</div>
                                            <div class="text-dark mt-1" style="white-space: pre-wrap;">${escapeHtml(t.repairDetails)}</div>
                                        </div>
                                    ` : ''}

                                    <!-- แผนกช่างที่ควบคุม & กำหนดเสร็จ -->
                                    <div class="mb-2 p-2 bg-white border border-2 border-dark rounded d-flex justify-content-between align-items-center" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.05);">
                                        <span class="small fw-bold"><i class="bi bi-people-fill text-secondary me-1"></i>แผนกช่างผู้รับผิดชอบ:</span>
                                        <span class="badge bg-dark text-white px-2 py-1 fs-6">${escapeHtml(t.assignDept || '-')}</span>
                                    </div>

                                    <div class="mb-2 p-2 bg-success-subtle border border-2 border-success rounded d-flex justify-content-between align-items-center">
                                        <span class="small fw-bold text-success-emphasis"><i class="bi bi-calendar2-check-fill me-1"></i>กำหนดแล้วเสร็จ:</span>
                                        <span class="fw-bold text-success fs-6">${escapeHtml(t.expectedDate || '-')}</span>
                                    </div>

                                    <div class="info-pill-box">
                                        <div class="small text-muted">
                                            <i class="bi bi-person-badge me-1"></i><strong>ช่างผู้รับเรื่อง/ประเมิน:</strong> ${escapeHtml(t.receiver || '-')}
                                            <span class="text-secondary ms-1">(${escapeHtml(t.receivedDate || '-')})</span>
                                        </div>
                                        ${t.refTicketId ? `
                                            <div class="small text-muted mt-1">
                                                <i class="bi bi-link-45deg me-1"></i><strong>ใบงานอ้างอิง:</strong> ${escapeHtml(t.refTicketId)}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>

                                <!-- 3. การพิจารณาของผู้บริหาร -->
                                <div class="col-lg-4 col-md-12">
                                    <h6 class="fw-bold text-dark border-bottom border-2 border-dark pb-2 mb-3 font-prompt">
                                        <i class="bi bi-pen-fill text-success me-1"></i> 3. ความเห็น & การตัดสินใจ
                                    </h6>

                                    <div class="alert alert-secondary py-2 small mb-3 border border-2 border-dark" style="box-shadow: 2px 2px 0 rgba(0,0,0,0.05);">
                                        <i class="bi bi-info-circle-fill me-1 text-primary"></i> เมื่อกดอนุมัติ ใบงานจะเปลี่ยนสถานะเป็น <b>"อยู่ระหว่างการดำเนินการ"</b> เพื่อให้ฝ่ายช่างเริ่มดำเนินการซ่อมทันที
                                    </div>

                                    <label for="note-${safeId}" class="form-label fw-bold small text-dark">
                                        <i class="bi bi-chat-left-dots-fill me-1 text-secondary"></i> ความเห็นผู้บริหาร / ข้อสั่งการเพิ่มเติม:
                                    </label>
                                    <textarea id="note-${safeId}" class="form-control form-control-neo mb-3" rows="4" placeholder="ระบุเหตุผล ข้อคิดเห็น หรือคำสั่งการเพิ่มเติม..."></textarea>

                                    <div class="d-flex flex-column gap-2">
                                        <button class="btn btn-neo-approve py-3 shadow-sm d-flex align-items-center justify-content-center" onclick="submitApproval('${escapeJs(t.ticket)}', '${safeId}', 'อนุมัติ')">
                                            <i class="bi bi-check-circle-fill me-2 fs-5"></i> อนุมัติการซ่อมบำรุง
                                        </button>
                                        <button class="btn btn-neo-reject py-2 shadow-sm d-flex align-items-center justify-content-center" onclick="submitApproval('${escapeJs(t.ticket)}', '${safeId}', 'ไม่อนุมัติ')">
                                            <i class="bi bi-x-circle-fill me-2"></i> ไม่อนุมัติ / ตีกลับแก้ไข
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ค้นหาและกรองใบงาน
        function filterJobs() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const cards = document.querySelectorAll('.job-item-card');
            let visibleCount = 0;
            cards.forEach(card => {
                const text = card.getAttribute('data-search-text') || '';
                if (!q || text.includes(q)) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            const badge = document.getElementById('jobCountBadge');
            if (badge) {
                badge.innerHTML = `<i class="bi bi-funnel-fill text-warning me-1"></i> พบ <b>${visibleCount}</b> รายการ`;
            }
        }

        // แสดง Modal ดูรูปขนาดใหญ่
        function openImageModal(url, title) {
            if (!url) return;
            document.getElementById('imageModalImg').src = url;
            document.getElementById('imageModalTitle').innerHTML = `<i class="bi bi-image me-2 text-warning"></i>${title || 'รูปภาพประกอบใบงาน'}`;
            const openBtn = document.getElementById('imageModalOpenNewTab');
            if (openBtn) openBtn.href = url;
            const modal = new bootstrap.Modal(document.getElementById('imagePreviewModal'));
            modal.show();
        }

        // การส่งผลการอนุมัติ / ปฏิเสธ
        async function submitApproval(ticketId, safeId, action) {
            const noteEl = document.getElementById(`note-${safeId}`);
            const appNote = (noteEl ? noteEl.value : '').trim();

            if (action === 'ไม่อนุมัติ' && !appNote) {
                if (!confirm(`คุณยังไม่ได้ระบุเหตุผลในการตีกลับ/ไม่อนุมัติ ต้องการดำเนินการต่อหรือไม่?\n(แนะนำให้ระบุเหตุผลในช่องความเห็นเพื่อให้ฝ่ายช่างรับทราบ)`)) {
                    if (noteEl) noteEl.focus();
                    return;
                }
            } else {
                if (!confirm(`ยืนยันการ "${action}" ใบงานรหัส ${ticketId}?`)) return;
            }

            // บันทึก Audit Log พร้อม IP และอุปกรณ์เครื่องจริง
            if (typeof logClientAction === 'function') {
                logClientAction(`ผู้บริหาร${action}งานซ่อม (ความเห็น: ${appNote || '-'})`, ticketId, "Approve.html");
            }

            // ล็อคปุ่มเพื่อป้องกันการกดย้ำ
            const currentButton = event && event.target ? event.target.closest('button') : null;
            if (currentButton) {
                currentButton.disabled = true;
                currentButton.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>กำลังบันทึก...`;
            }

            if (action === 'อนุมัติ') {
                const nextStatus = 'อยู่ระหว่างการดำเนินการ';
                const approverInfo = { 
                    name: currentName || 'ผู้บริหาร', 
                    position: currentPos || 'Management', 
                    note: "อนุมัติ: " + (appNote || "อนุมัติแผนการซ่อมบำรุงเรียบร้อย") 
                };
                google.script.run
                    .withSuccessHandler(function(res) {
                        alert(res.message || "อนุมัติการซ่อมบำรุงเรียบร้อยแล้ว!");
                        loadPendingJobs();
                    })
                    .withFailureHandler(function(err) {
                        alert("เกิดข้อผิดพลาดในการอนุมัติ: " + (err.message || err));
                        if (currentButton) {
                            currentButton.disabled = false;
                            currentButton.innerHTML = `<i class="bi bi-check-circle-fill me-2 fs-5"></i> อนุมัติการซ่อมบำรุง`;
                        }
                    })
                    .updateTicketStatus_Full(ticketId, nextStatus, "", "", "", "", "", "", "", "", currentLogin, 60, "", "", "", null, approverInfo);
            } else {
                // ตีกลับสร้างใบใหม่ หรือส่งกลับแก้ไข
                google.script.run
                    .withSuccessHandler(function(res) {
                        alert(res.message || "ตีกลับใบงานเรียบร้อยแล้ว!");
                        loadPendingJobs();
                    })
                    .withFailureHandler(function(err) {
                        alert("เกิดข้อผิดพลาดในการตีกลับ: " + (err.message || err));
                        if (currentButton) {
                            currentButton.disabled = false;
                            currentButton.innerHTML = `<i class="bi bi-x-circle-fill me-2"></i> ไม่อนุมัติ / ตีกลับแก้ไข`;
                        }
                    })
                    .rejectAndCloneTicket(ticketId, "ถูกตีกลับ (โดยผู้บริหาร)", appNote || "ไม่อนุมัติแผนการซ่อมบำรุง", currentLogin, currentName);
            }
        }

        window.onload = function() { 
            updateTopNavbar(); 
            loadPendingJobs(); 
            // อัพเดทข้อมูลอัตโนมัติทุกๆ 10 นาที
            setInterval(loadPendingJobs, 600000);
        };
    </script>
</body>
</html>
