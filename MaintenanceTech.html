<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบงานช่างซ่อมบำรุง - CMMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <script src="api.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neo-dark: #191A23;
            --neo-light: #F8F9FA;
            --neo-green: #B9FF66;
            --neo-orange: #FF9900;
            --neo-white: #FFFFFF;
            --border-width: 2px;
            --shadow-depth: 4px;
        }

        body { 
            background-color: var(--neo-white); 
            font-family: 'Sarabun', sans-serif; 
            color: var(--neo-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .system-header { 
            background-color: var(--neo-white); 
            color: var(--neo-dark); 
            padding: 15px 0; 
            border-bottom: var(--border-width) solid var(--neo-dark); 
            margin-bottom: 2rem;
        }

        .header-brand {
            font-weight: 800;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
        }

        .card-neo { 
            border-radius: 12px; 
            border: var(--border-width) solid var(--neo-dark); 
            box-shadow: var(--shadow-depth) var(--shadow-depth) 0px var(--neo-dark); 
            background-color: var(--neo-white);
            box-shadow: 6px 6px 0px var(--neo-dark);
        }

        .badge-dept {
            background-color: var(--neo-orange);
            color: var(--neo-white);
            border: var(--border-width) solid var(--neo-dark);
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--neo-dark);
        }

        .badge-ticket {
            background-color: var(--neo-green);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .badge-status {
            background-color: #00D1FF;
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .img-preview-box {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: var(--border-width) solid var(--neo-dark);
            cursor: pointer;
            background-color: #eee;
        }

        .form-control, .form-select {
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            box-shadow: 2px 2px 0px var(--neo-dark);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            box-shadow: 4px 4px 0px var(--neo-green);
            border-color: var(--neo-dark);
        }

        .btn-neo {
            background-color: var(--neo-white);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 8px;
            font-weight: 700;
            padding: 8px 16px;
            box-shadow: 3px 3px 0px var(--neo-dark);
            transition: all 0.15s ease;
        }

        .btn-neo:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--neo-dark);
            background-color: var(--neo-green);
        }

        .btn-complete {
            background-color: var(--neo-green);
            color: var(--neo-dark);
            border: var(--border-width) solid var(--neo-dark);
            font-weight: 800;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--neo-dark);
            width: 100%;
            transition: all 0.15s ease;
        }

        .btn-complete:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--neo-dark);
            background-color: #a3f542;
        }

        .btn-complete:disabled {
            background-color: #ccc;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        .job-card-wrapper {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .job-card-wrapper.removing {
            opacity: 0;
            transform: scale(0.9) translateY(-20px);
        }

        .empty-state {
            border: var(--border-width) dashed var(--neo-dark);
            border-radius: 16px;
            padding: 40px 20px;
            background-color: var(--neo-white);
            text-align: center;
        }

        .modal-img-content {
            border: var(--border-width) solid var(--neo-dark);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="system-header border-bottom border-3 border-dark mb-4" style="background-color: var(--neo-green); padding: 15px 0; box-shadow: 0 4px 0 var(--neo-dark);">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="header-brand fw-bold fs-4 text-dark" style="cursor:pointer;" onclick="window.location.href='Home.html'">
                <i class="bi bi-wrench-adjustable-circle-fill me-2 text-warning"></i> ช่างแผนกซ่อมบำรุง (Maintenance)
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge-dept">
                    <i class="bi bi-gear-wide-connected me-1"></i> แผนกซ่อมบำรุง
                </span>
                <a href="Home.html" class="btn btn-light border-2 border-dark fw-bold rounded ms-2" style="box-shadow: 2px 2px 0 var(--neo-dark);"><i class="bi bi-house-door me-1"></i> Home</a>
            </div>
        </div>
    </header>

    <div class="container my-4 flex-grow-1" style="max-width: 800px;">
        
        <!-- Controls & Summary Banner -->
        <div class="card-neo p-3 mb-4 d-flex flex-row justify-content-between align-items-center">
            <div>
                <h5 class="fw-bold mb-0">🔧 รายการงานซ่อมค้างดำเนินการ</h5>
                <p class="text-muted small mb-0">อัปโหลดรูปภาพงานหลังซ่อมเสร็จเพื่อส่งมอบงาน</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-dark fs-6 rounded-pill px-3 py-2" id="jobCounter">กำลังโหลด...</span>
                <button class="btn-neo btn-sm" onclick="loadJobs()">
                    <i class="bi bi-arrow-clockwise"></i> รีเฟรช
                </button>
            </div>
        </div>

        <!-- Global Status Alert -->
        <div id="globalAlert"></div>

        <!-- Job Cards Container -->
        <div id="jobsList">
            <div class="text-center py-5">
                <div class="spinner-border text-dark" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
                <p class="mt-3 fw-bold text-muted">กำลังโหลดรายการงานซ่อมสำหรับแผนกซ่อมบำรุง...</p>
            </div>
        </div>

    </div>

    <!-- Modal ดูรูปขนาดเต็ม -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-img-content">
                <div class="modal-header border-bottom border-2 border-dark">
                    <h5 class="modal-title fw-bold" id="imageModalTitle">🖼️ ภาพถ่ายอาการเสีย</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-2">
                    <img id="modalImg" src="" class="img-fluid rounded" style="max-height: 75vh;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var selectedFilesMap = {};
        var currentJobs = [];

        window.onload = function() {
            loadJobs();
        };

        function loadJobs() {
            var jobsList = document.getElementById('jobsList');
            var jobCounter = document.getElementById('jobCounter');
            
            jobCounter.innerText = "กำลังดึงข้อมูล...";
            jobsList.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-dark" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
                    <p class="mt-3 fw-bold text-muted">กำลังค้นหางานซ่อมสำหรับแผนกซ่อมบำรุง...</p>
                </div>
            `;

            google.script.run
                .withSuccessHandler(renderJobs)
                .withFailureHandler(function(err) {
                    jobCounter.innerText = "Error";
                    jobsList.innerHTML = `
                        <div class="alert alert-danger border-2 border-dark rounded-4 shadow-sm p-4 text-center">
                            <h5>❌ ไม่สามารถโหลดรายการงานได้</h5>
                            <p class="mb-0 small">${err.message || err}</p>
                            <button class="btn-neo mt-3" onclick="loadJobs()">ลองใหม่อีกครั้ง</button>
                        </div>
                    `;
                })
                .getTechnicianJobs('ซ่อมบำรุง');
        }

        function renderJobs(response) {
            var jobsList = document.getElementById('jobsList');
            var jobCounter = document.getElementById('jobCounter');

            if (!response || !response.success) {
                jobCounter.innerText = "0 รายการ";
                jobsList.innerHTML = `<div class="alert alert-danger">เกิดข้อผิดพลาด: ${response.message || 'ไม่ทราบสาเหตุ'}</div>`;
                return;
            }

            currentJobs = response.jobs || [];
            jobCounter.innerText = currentJobs.length + " รายการ";

            if (currentJobs.length === 0) {
                jobsList.innerHTML = `
                    <div class="empty-state">
                        <div class="fs-1">🎉</div>
                        <h4 class="fw-bold mt-2">ไม่มีงานซ่อมค้างดำเนินการ</h4>
                        <p class="text-muted mb-0">ขณะนี้ไม่มีรายการงานซ่อมสำหรับแผนกซ่อมบำรุง</p>
                    </div>
                `;
                return;
            }

            var html = '';
            currentJobs.forEach(function(job) {
                var imgTag = job.imageUrl 
                    ? `<img src="${job.imageUrl}" class="img-preview-box" onclick="showImageModal('${job.imageUrl}', '${job.ticketId}')" title="กดดูรูปใหญ่">`
                    : `<div class="img-preview-box d-flex align-items-center justify-content-center text-muted fw-bold"><i class="bi bi-image me-1"></i> ไม่มีรูปภาพ</div>`;

                html += `
                    <div class="job-card-wrapper mb-4" id="card-wrapper-${job.ticketId}">
                        <div class="card-neo p-4">
                            <!-- Card Header -->
                            <div class="d-flex justify-content-between align-items-start mb-3 border-bottom border-2 border-dark pb-2">
                                <div>
                                    <span class="badge-ticket me-2">${job.ticketId}</span>
                                    <span class="badge-status">${job.status}</span>
                                </div>
                                <div class="text-end small text-muted">
                                    <i class="bi bi-clock me-1"></i> ${job.reqDate}
                                </div>
                            </div>

                            <!-- Job Body -->
                            <div class="row g-3">
                                <div class="col-md-5">
                                    ${imgTag}
                                    <div class="small text-muted text-center mt-1">คลิกที่รูปเพื่อขยายใหญ่</div>
                                </div>
                                <div class="col-md-7">
                                    <h5 class="fw-bold text-dark mb-1">
                                        <i class="bi bi-tools text-primary me-1"></i> ${job.target}
                                    </h5>
                                    <div class="p-2 border rounded bg-light mb-2 small" style="border: 2px solid #191A23 !important;">
                                        <strong>อาการเสีย:</strong> ${job.problem}
                                    </div>
                                    <div class="small">
                                        <div><strong>ผู้แจ้ง:</strong> ${job.reqName} (${job.reqPosition})</div>
                                        <div><strong>แผนกรับผิดชอบ:</strong> <span class="badge bg-warning text-dark border border-dark">${job.assignDept}</span></div>
                                        ${job.expectedDate ? `<div class="text-danger mt-1"><strong>กำหนดเสร็จ:</strong> ${job.expectedDate}</div>` : ''}
                                    </div>
                                </div>
                            </div>

                            <!-- Technician Action Form -->
                            <div class="mt-4 pt-3 border-top border-2 border-dark bg-light p-3 rounded-3" style="border: 2px solid #191A23 !important;">
                                <h6 class="fw-bold mb-3 text-dark"><i class="bi bi-camera-fill me-1"></i> อัปโหลดรูปภาพผลงานหลังซ่อมเสร็จ</h6>
                                
                                <form id="form-${job.ticketId}" onsubmit="submitCompletion(event, '${job.ticketId}')">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">รายละเอียดการซ่อมแซม / แก้ไข</label>
                                        <input type="text" class="form-control" id="details-${job.ticketId}" placeholder="ระบุสิ่งที่ได้ดำเนินการซ่อมแซม..." required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">📸 ถ่ายรูปหรือเลือกรูปหลังซ่อมเสร็จ</label>
                                        <div class="d-flex gap-2 mb-2">
                                            <button type="button" class="btn btn-outline-dark flex-fill fw-bold border-2" onclick="triggerCamera('${job.ticketId}')">
                                                <i class="bi bi-camera me-1"></i> ถ่ายรูป
                                            </button>
                                            <button type="button" class="btn btn-outline-dark flex-fill fw-bold border-2" onclick="triggerGallery('${job.ticketId}')">
                                                <i class="bi bi-image me-1"></i> เลือกรูป
                                            </button>
                                        </div>
                                        
                                        <input type="file" id="camera-${job.ticketId}" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(this, '${job.ticketId}')">
                                        <input type="file" id="gallery-${job.ticketId}" accept="image/*" style="display: none;" onchange="handleFileSelect(this, '${job.ticketId}')">

                                        <div id="file-status-${job.ticketId}" class="small p-2 border border-2 border-dark rounded bg-white text-center text-muted">
                                            ยังไม่ได้เลือกรูปภาพหลังซ่อม
                                        </div>
                                    </div>

                                    <button type="submit" class="btn-complete" id="btn-submit-${job.ticketId}">
                                        🚀 ยืนยันปิดงาน & ส่งรับมอบ
                                    </button>
                                </form>
                                <div id="msg-${job.ticketId}" class="mt-2 text-center small"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            jobsList.innerHTML = html;
        }

        function triggerCamera(ticketId) {
            document.getElementById('camera-' + ticketId).click();
        }

        function triggerGallery(ticketId) {
            document.getElementById('gallery-' + ticketId).click();
        }

        function handleFileSelect(input, ticketId) {
            var statusDiv = document.getElementById('file-status-' + ticketId);
            if (input.files && input.files[0]) {
                var file = input.files[0];
                selectedFilesMap[ticketId] = file;
                statusDiv.innerHTML = `<span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i> เลือกรูปแล้ว: ${file.name}</span>`;
                
                if (input.id === 'camera-' + ticketId) {
                    document.getElementById('gallery-' + ticketId).value = '';
                } else {
                    document.getElementById('camera-' + ticketId).value = '';
                }
            } else {
                delete selectedFilesMap[ticketId];
                statusDiv.innerHTML = 'ยังไม่ได้เลือกรูปภาพหลังซ่อม';
            }
        }

        function submitCompletion(event, ticketId) {
            event.preventDefault();
            
            var file = selectedFilesMap[ticketId];
            if (!file) {
                alert("⚠️ กรุณาถ่ายรูปหรือเลือกรูปภาพผลงานหลังซ่อมเสร็จก่อนส่งครับ");
                return;
            }

            var submitBtn = document.getElementById('btn-submit-' + ticketId);
            var msgDiv = document.getElementById('msg-' + ticketId);
            var repairDetails = document.getElementById('details-' + ticketId).value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>กำลังอัปโหลดรูปภาพและส่งข้อมูล...`;
            msgDiv.innerHTML = '';

            var reader = new FileReader();
            reader.onload = async function() {
                var base64Data = reader.result.split(',')[1];
                let netInfo = { ip: "-", device: "-" };
                try { netInfo = await getRealClientNetworkInfo(); } catch(e){}

                var payload = {
                    ticketId: ticketId,
                    repairDetails: repairDetails,
                    file: {
                        base64: base64Data,
                        mimeType: file.type,
                        fileName: file.name
                    },
                    techName: localStorage.getItem('userName') || "ช่างซ่อมบำรุง",
                    authUser: localStorage.getItem('userLogin') || "MAINTENANCE_TECH",
                    clientIp: netInfo.ip,
                    clientDevice: netInfo.device
                };

                google.script.run
                    .withSuccessHandler(function(res) {
                        if (res.success) {
                            msgDiv.innerHTML = `<div class="alert alert-success border-2 border-dark py-2 mb-0">${res.message}</div>`;
                            
                            setTimeout(function() {
                                var cardWrapper = document.getElementById('card-wrapper-' + ticketId);
                                if (cardWrapper) {
                                    cardWrapper.classList.add('removing');
                                    setTimeout(function() {
                                        cardWrapper.remove();
                                        delete selectedFilesMap[ticketId];
                                        
                                        currentJobs = currentJobs.filter(j => j.ticketId !== ticketId);
                                        document.getElementById('jobCounter').innerText = currentJobs.length + " รายการ";
                                        
                                        if (currentJobs.length === 0) {
                                            renderJobs({ success: true, jobs: [] });
                                        }
                                    }, 400);
                                }
                            }, 800);

                        } else {
                            msgDiv.innerHTML = `<div class="alert alert-danger border-2 border-dark py-2 mb-0">${res.message}</div>`;
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = `🚀 ยืนยันปิดงาน & ส่งรับมอบ`;
                        }
                    })
                    .withFailureHandler(function(err) {
                        msgDiv.innerHTML = `<div class="alert alert-danger border-2 border-dark py-2 mb-0">Error: ${err.message || err}</div>`;
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `🚀 ยืนยันปิดงาน & ส่งรับมอบ`;
                    })
                    .completeTechnicianWork(payload);
            };

            reader.readAsDataURL(file);
        }

        function showImageModal(url, title) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModalTitle').innerText = '🖼️ รูปภาพงานซ่อม (' + title + ')';
            var modal = new bootstrap.Modal(document.getElementById('imageModal'));
            modal.show();
        }
    </script>
</body>
</html>
